<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAPs IT</title>
<meta name="theme-color" content="#0d0b09">
<meta name="description" content="نظام MAPs: الأجهزة، الدعم الفني، الصيانة العامة، الطلبيات وطلبات الشراء">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAPs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0d0b09;--txt:#f5efe4;--mut:#a39a88;--acc:#d4af6a;--bd:#3a3226}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,sans-serif;overflow:hidden}
  body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  #app{position:fixed;inset:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0) 0;width:100%;height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:var(--bg)}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:5;transition:opacity .35s}
  #splash.out{opacity:0;pointer-events:none}
  #splash img{width:96px;height:96px;border-radius:22px}
  .bar{width:120px;height:3px;border-radius:3px;background:var(--bd);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:var(--acc);border-radius:3px;animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  #splash small{color:var(--mut);font-size:.8rem}
  #msg{display:none;max-width:320px;text-align:center;line-height:1.7;color:var(--mut)}
  #msg button{margin-top:12px;background:var(--acc);color:#1a1306;border:0;border-radius:12px;padding:10px 22px;font:inherit;font-weight:700}
  #tip{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:none;align-items:center;gap:12px;background:#1a1612;border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:.9rem}
  #tip img{width:40px;height:40px;border-radius:10px}
  #tip div{flex:1;line-height:1.5}
  #tip button{background:var(--acc);color:#1a1306;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700}
  #tip .x{background:transparent;color:var(--mut);padding:6px 8px}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="MAPs">
  <div class="bar"><i></i></div>
  <small id="sub">عم يفتح النظام…</small>
  <div id="msg"></div>
</div>
<iframe id="app" title="MAPs IT" allow="camera; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="tip"><img src="icon-192.png" alt=""><div id="tipTxt"></div><button id="tipGo">تثبيت</button><button class="x" id="tipX" aria-label="إغلاق">✕</button></div>

<script>
  // ====== الإعداد الوحيد: رابط النشر (exec) من Apps Script ← Deploy ← Manage deployments ======
  const APP = "https://script.google.com/a/macros/multiaidprograms.org/s/AKfycbwxnHFya7cjlBPA-4x5Bw1pTZqXztN6tEK0pvG1Kz7xKlSXL-PGAqsBG8Q7yAUv-jMj/exec";
  // ==========================================================================================

  const $ = id => document.getElementById(id);
  const splash = $('splash'), frame = $('app');
  function fail(t, retry){ $('sub').style.display='none'; document.querySelector('.bar').style.display='none';
    $('msg').style.display='block'; $('msg').innerHTML = t + (retry ? '<br><button onclick="location.reload()">جرّب كمان مرة</button>' : ''); }

  if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[^/]+\/exec$/.test(APP)) {
    fail('لازم تحط رابط النظام (exec) بملف index.html بسطر APP.', false);
  } else if (!navigator.onLine) {
    fail('ما في إنترنت هلّق. تأكد من الاتصال.', true);
  } else {
    // منمرّق كل شي بالرابط (room / go / asset / scan) للنظام، ومنضيف app=1 لتنحفظ الجلسة بالتطبيق
    const q = new URLSearchParams(location.search); q.delete('source'); q.set('app', '1');
    frame.src = APP + '?' + q.toString();
    let done = false;
    const hide = () => { if (done) return; done = true; setTimeout(() => splash.classList.add('out'), 250); };
    frame.addEventListener('load', hide);
    setTimeout(hide, 9000);
  }
  addEventListener('online', () => { if ($('msg').style.display === 'block') location.reload(); });

  // ====== التثبيت على الشاشة الرئيسية ======
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const seen = () => { try { return localStorage.getItem('maps_tip') === '1'; } catch (_) { return false; } };
  const mark = () => { try { localStorage.setItem('maps_tip', '1'); } catch (_) {} };
  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (!standalone && !seen()) { $('tipTxt').textContent = 'ثبّت MAPs على جوالك ليفتح متل التطبيق'; $('tip').style.display = 'flex'; }
  });
  $('tipGo').onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; } $('tip').style.display = 'none'; mark(); };
  $('tipX').onclick = () => { $('tip').style.display = 'none'; mark(); };
  // آيفون: ما في زر تثبيت، منشرحلهم مرة وحدة
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && !seen()) {
    $('tipTxt').innerHTML = 'لتثبيته: اكبس <b>مشاركة</b> تحت ← <b>إضافة إلى الشاشة الرئيسية</b>';
    $('tipGo').style.display = 'none'; setTimeout(() => $('tip').style.display = 'flex', 2500);
  }

  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
